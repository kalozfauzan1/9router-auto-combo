services:
  9router:
    # Built from the branch checked out in this Dokploy project's source directory.
    # Requires Compose with local-context support (standard for Dokploy).
    build:
      context: .
    image: 9router-auto-combo:relay-failover-4998
    container_name: 9router-auto-combo
    restart: always
    ports:
      - "20129:20129"
    volumes:
      - 9router-data:/app/data
    env_file:
      # Optional: create it first with `cp .env.example .env` and set
      # JWT_SECRET / INITIAL_PASSWORD. Missing .env no longer aborts the deploy.
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      PORT: "20129"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production

volumes:
  9router-data:
    name: 9router-data
