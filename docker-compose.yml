services:
  9router:
    # Built from this fork's master branch (auto/smart combo).
    # Requires Compose with BuildKit git-context support.
    build:
      # Build the branch checked out by Dokploy, not a hard-coded master context.
      context: .
    image: 9router-auto-combo:branch
    container_name: 9router-auto-combo
    restart: always
    ports:
      - "20129:20129"
    volumes:
      - 9router-data:/app/data
    env_file:
      # Optional: create it first with `cp .env.example .env` and set
      # JWT_SECRET / INITIAL_PASSWORD. Missing .env no longer aborts the deploy.
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      PORT: "20129"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production

volumes:
  9router-data:
    name: 9router-data
